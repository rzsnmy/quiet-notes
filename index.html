<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quiet Notes</title>

  <!-- PWA / app-like display -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#fbfaf8" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Quiet Notes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <button id="openList" title="Notes">notes</button>
  <div id="sidebarBackdrop"></div>
  <div id="app">
    <aside id="sidebar">
      <div id="topbar">
        <input id="search" type="search" placeholder="search" autocomplete="off" />
        <button id="newNote" title="New note">＋</button>
      </div>

      <div id="noteList" aria-label="notes"></div>

      <div id="sideActions">
        <button id="exportHtml">export</button>
        <button id="deleteNote">delete</button>
      </div>
    </aside>

    <main id="main">
      <div id="status">not connected</div>
      <article id="editor" contenteditable="true" spellcheck="true" aria-label="note"></article>
    </main>
  </div>

  <div id="setupNotice" hidden>
    <div class="setupCard">
      <h1>Quiet Notes</h1>
      <p>秘密キーを入れてください。同じキーを使う端末だけ、同じメモ帳につながります。</p>
      <input id="spaceKeyInput" type="text" placeholder="secret key" autocomplete="off" />
      <div class="setupButtons">
        <button id="useKey">このキーで開く</button>
        <button id="makeKey">新しい秘密キーを作る</button>
      </div>
      <p class="setupHint">PWAとして開いたときに空画面になったら、同じ秘密キーをここに貼ればOKです。</p>
    </div>
  </div>

  <!-- Sanitizes pasted/saved rich text. -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>

  <!-- Your app code. -->
  <script type="module" src="./app.js"></script>
</body>
</html>
